<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Protokoll</title>
    <meta name="description" content="Einfaches Protokoll für Notizen mit Zeitstempel">
    <meta name="theme-color" content="#007BFF">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <style>
      html, body {
          height: 100dvh;
          margin: 0;
          padding: 0;
      }
      body {
          font-family: Arial, sans-serif;
          max-width: 600px;
          margin: 0 auto;
          padding: 5px;
          display: flex;
          flex-direction: column;
          height: 100dvh;
          box-sizing: border-box;
          overflow: hidden;
      }
      #app {
          display: flex;
          flex-direction: column;
          height: 100%;
      }
      .header {
          margin-bottom: 10px;
      }
      .title-container {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
      }
      .title-wrapper {
          display: flex;
          flex-direction: column;
      }
      #editableTitle {
          font-size: 1.5em;
          font-weight: bold;
          margin: 0;
          padding: 5px;
          border: none;
          outline: none;
          background: transparent;
          white-space: nowrap;
      }
      .info {
          font-size: 0.7em;
          color: #666;
          margin: 2px 0 0 5px;
      }
      #timeList {
          flex: 1;
          overflow-y: auto;
          border: 1px solid #ddd;
          padding: 4px;
          border-radius: 4px;
          margin: 4px 0;
          display: flex;
          flex-direction: column-reverse;
      }
      .timeEntry {
          display: flex;
          align-items: center;
          margin-bottom: 10px;
      }
      .timeEntry span {
          margin-right: 10px;
          white-space: nowrap;
      }
      button {
          padding: 10px 15px;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
      }
      button:hover {
          opacity: 0.9;
      }
      .icon-button {
          font-size: 1.5em;
          font-weight: bold;
      }
      #clearButton {
          background-color: #dc3545;
      }
      #clearButton:hover {
          background-color: #c82333;
      }
      #downloadButton {
          background-color: #28a745;
          margin-right: 3px;
      }
      #downloadButton:hover {
          background-color: #218838;
      }
      #shareButton {
          background-color: #28a745;
          margin-right: 3px;
      }
      #shareButton:hover {
          background-color: #218838;
      }
      #logTimeButton {
          background-color: #007BFF;
          height: 60px;
      }
      #logTimeButton:hover {
          background-color: #0056b3;
      }
      input[type="text"] {
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 4px;
          flex-grow: 1;
      }
      #noteInput {
          margin-left: 10px;
          padding: 8px;
          border: 1px solid #ccc;
          border-radius: 4px;
          flex-grow: 1;
      }
      .entryContainer {
          display: flex;
          align-items: center;
          margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="header">
        <div class="title-container">
          <div class="title-wrapper">
            <h1 id="editableTitle" contenteditable="true">Protokoll</h1>
            <span class="info">v1.2.3~rc2 &emsp; <span id="ptbOffset" title="The amount of time your system clock deviates from the atomic clock of the PTB"></span></span>
          </div>
          <div>
            <button id="downloadButton" class="icon-button" title="Als CSV herunterladen">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="bevel"><path d="M3 15v4c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2v-4M17 9l-5 5-5-5M12 12.8V2.5"/></svg>
            </button>
            <button id="shareButton" class="icon-button" title="Als CSV teilen">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="bevel"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            </button>
            <button id="clearButton" class="icon-button" tabindex="-1" title="Alle Einträge löschen">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="bevel"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          </div>
        </div>
      </div>
      <div id="timeList"></div>
      <div class="entryContainer">
        <button id="logTimeButton" tabindex="-1">Zeit protokollieren!</button>
        <input type="text" tabindex="8192" id="noteInput" placeholder="Notiz hinzufügen..."
               enterkeyhint="send" inputmode="text"
               title="Eintrag löschen: Notiz auf 'xxx' setzen und bestätigen" />
      </div>
    </div>
    <script id="ptbScript" src="ptb.js"></script>
    <script id="logbookScript" src="logbook.js"></script>
  </body>
</html>
